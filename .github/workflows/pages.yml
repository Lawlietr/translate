name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          NEXT_BASE_PATH: /translate
        run: npm run build:export

      - name: Verify wasm sizes
        run: |
          echo "=== wasm file sizes ==="
          find out -name "*.wasm*" -exec du -h {} +
          for f in $(find out -name "*.wasm*"); do
            size=$(stat -c%s "$f")
            if [ "$size" -ge 26214400 ]; then
              echo "FAIL: $f is $((size / 1048576)) MiB (>= 25 MiB)"
              exit 1
            fi
          done
          echo "All wasm files < 25 MiB"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
