name: Docker image

on:
  push:
    branches: [main, DEV]
  workflow_dispatch:

env:
  IMAGE_GHCR: ghcr.io/lawlietr/translate
  IMAGE_CODEBERG: codeberg.org/lawlietr/translate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to Codeberg
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: lawlietr
          password: ${{ secrets.CODEBERG_TOKEN }}

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
            ${{ env.IMAGE_CODEBERG }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute release tag
        id: rel
        if: github.ref == 'refs/heads/main'
        run: |
          echo "tag=v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.tag }}
          body: |
            ## Docker image

            Multi-arch (`linux/amd64` + `linux/arm64`) static image — the same image is published to **both** registries.

            ```bash
            docker pull codeberg.org/lawlietr/translate:latest
            docker pull ghcr.io/lawlietr/translate:latest
            ```

            Pin a commit: `codeberg.org/lawlietr/translate:<sha>` / `ghcr.io/lawlietr/translate:<sha>`.

            See `docker-compose.yml` in the repo for the serve config (self-signed TLS on 8443 for WebGPU).
